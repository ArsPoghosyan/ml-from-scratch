[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch"
version = "0.1.0"
description = "Core machine learning algorithms built from scratch using Python and NumPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0"
]

[tool.setuptools.packages.find]
where = ["."]